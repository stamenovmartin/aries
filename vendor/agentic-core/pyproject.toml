[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-core"
version = "1.0.0"
description = "Reusable agentic orchestration engine (Director graph, resumable DAG, evaluation loop, approvals, memory, scheduler, observability, security) extracted from the Insomnia Marketing OS."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy[asyncio]==2.0.36",
  "aiosqlite==0.20.0",
  "asyncpg==0.30.0",
  "pydantic-settings==2.7.0",
  "httpx==0.28.1",
  "python-multipart==0.0.18",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
include = ["agentic_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
